# Deploy: fly launch --name zettabrain-trial-proxy
# Set secret: fly secrets set GEMINI_API_KEY=your-key-here

app = "zettabrain-trial-proxy"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_REQUESTS = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
