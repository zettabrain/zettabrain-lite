[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zettabrain-lite"
version = "0.2.0"
description = "ZettaBrain Lite — Free local AI RAG + Skills platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Olajide Shobowale"}]

dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "httpx>=0.24",
    "requests>=2.28",
    "pydantic>=2.0",
    "sqlmodel>=0.0.14",
    "sqlite-vec>=0.1.6",
    "python-frontmatter>=1.0",
    "pypdf>=3.0",
    "docx2txt>=0.8",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "msal>=1.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
claude = ["anthropic>=0.25"]
all = ["openai>=1.0", "anthropic>=0.25", "fpdf2>=2.7", "python-docx>=1.1", "pymupdf>=1.23"]

[project.scripts]
zettabrain-lite = "zettabrain_lite.cli:main"

[tool.setuptools.packages.find]
include = ["zettabrain_lite*"]

[tool.setuptools.package-data]
zettabrain_lite = ["static/*", "skills/*.md", "scripts/*.py"]
